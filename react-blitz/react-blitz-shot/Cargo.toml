[package]
name = "react-blitz-shot"
description = "Paint a built React page, drawn by Blitz, to a PNG with no window"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "react-blitz-shot"
path = "src/main.rs"

[dependencies]
react-blitz = { path = "../react-blitz" }
react-blitz-v8 = { path = "../react-blitz-v8" }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true, features = ["svg"] }
blitz-traits = { workspace = true }
anyrender = "0.15.0"
anyrender_vello_cpu = "0.19.0"
peniko = "0.6.0"
png = "0.18"
anyhow = "1"

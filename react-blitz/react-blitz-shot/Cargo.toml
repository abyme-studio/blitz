[package]
name = "react-blitz-shot"
description = "Paint a built React page, drawn by Blitz, to a PNG with no window; and react-blitz-window, a window drive can step and steer"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "react-blitz-shot"
path = "src/main.rs"

[[bin]]
name = "react-blitz-window"
path = "src/bin/window.rs"

[dependencies]
react-blitz = { path = "../react-blitz" }
react-blitz-v8 = { path = "../react-blitz-v8" }
blitz-dom = { workspace = true }
blitz-paint = { workspace = true, features = ["svg"] }
blitz-traits = { workspace = true }
blitz-shell = { workspace = true }
winit = "=0.31.0-beta.4"
atomic_refcell = "0.1.13"
keyboard-types = "0.8"
serde_json = "1"
anyrender = "0.15.0"
anyrender_vello = "0.16.0"
anyrender_vello_cpu = "0.19.0"
softbuffer = "0.4"
peniko = "0.6.0"
png = "0.18"
anyhow = "1"

[features]
# Each resolve's phases (style, layout, paint tree) timed on stdout.
phase-times = ["blitz-dom/log-phase-times"]

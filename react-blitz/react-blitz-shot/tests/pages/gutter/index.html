<html>
  <head>
    <style>
      body { margin: 0; }
      [data-preview-frame] { position: relative; width: 300px; height: 200px; }
      .scroller { position: absolute; left: 0; width: 200px; height: 40px; overflow-y: auto; }
      .thin { top: 0; scrollbar-gutter: stable; scrollbar-width: thin; }
      .wide { top: 50px; scrollbar-gutter: stable; }

      .plain { top: 150px; }
      .row { height: 10px; }
    </style>
  </head>

    <script type="module" src="./app.js"></script>
